runtime_endpoints:
  anthropic_api:
    provider: anthropic_native
    base_url: https://api.anthropic.com
    api_key: "${ANTHROPIC_API_KEY:-}"
    api_key_env: ANTHROPIC_API_KEY
    concurrency_limit: 4
    timeout_s: 600

models:
  claude_sonnet_4_6:
    endpoint_pool: [anthropic_api]
    model: claude-sonnet-4-6
    context_window: 200000
    capability_tags: [chat, text, image, thinking, tool_use]

  claude_opus_4_7:
    endpoint_pool: [anthropic_api]
    model: claude-opus-4-7
    context_window: 200000
    capability_tags: [chat, text, image, thinking, tool_use]

model_pools:
  frontier_anthropic:
    models: [claude_sonnet_4_6]
    selection: first
